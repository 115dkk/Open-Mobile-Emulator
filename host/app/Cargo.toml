#
# The thin Tauri shell (docs/adr/0001-rust-core-thin-shell.md). It creates the window, admits one
# command at a time, forwards it to ome-runtime and emits snapshots. Nothing else lives here.
[package]
name = "ome-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Thin Tauri presentation shell for Open Mobile Emulator"

[lib]
name = "ome_app_lib"
crate-type = ["rlib"]

[[bin]]
name = "ome"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Defaults off: no dynamic-acl, x11 or dbus. tray-icon is the only extra feature.
# 2.11.6 carries the fix for GHSA-w28w-mhc8-qvjv (channel data bound to its webview).
tauri = { version = "2.11.6", default-features = false, features = ["wry", "compression", "common-controls-v6", "tray-icon"] }
tauri-plugin-single-instance = "2.4.5"
ome-runtime = { path = "../crates/ome-runtime" }
ome-supervisor = { path = "../crates/ome-supervisor" }
ome-artifacts = { path = "../crates/ome-artifacts" }
ome-adb = { path = "../crates/ome-adb" }
ome-window-host = { path = "../crates/ome-window-host" }
ome-overlay = { path = "../crates/ome-overlay" }
ome-host-check = { path = "../crates/ome-host-check" }
arboard.workspace = true
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
ome-platform-win = { path = "../crates/ome-platform-win" }

[features]
# Set by the Tauri CLI for production builds; never enable by hand.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
