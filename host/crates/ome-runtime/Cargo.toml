ome-platform-win = { path = "../ome-platform-win" }
ome-guest-image = { path = "../ome-guest-image" }
ome-wizard = { path = "../ome-wizard" }
ome-diagnostics = { path = "../ome-diagnostics" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jiff.workspace = true
semver.workspace = true
sha2.workspace = true
tempfile = "3.23.0"

[dev-dependencies]
ome-guest-install = { path = "../ome-guest-install", features = ["test-support"] }
