#
# cargo-deny policy for the host workspace. Run from host/:
#   cargo deny --locked --all-features --workspace check licenses
#   cargo deny --locked --all-features --workspace check advisories
# Our own code is GPL-2.0-or-later (D6); Apache-2.0 dependencies combine under GPL-3.0 (the
# route CLAUDE.md D6 already accepts). Anything not listed fails the check.

[graph]
all-features = true
exclude-dev = false
exclude-unpublished = false

[licenses]
include-dev = true
include-build = true
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = false

[advisories]
# A vulnerability is denied wherever it sits in the graph. Unmaintained crates are judged only
# where this workspace can act on them (Tauri's own GTK and urlpattern chains carry
# unmaintained advisories with no safe upgrade). A yanked release is always our problem.
unmaintained = "workspace"
yanked = "deny"
